<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌍 Ghana Chatbot</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-wrapper">
        <div class="container">
            <!-- Chat List Sidebar (English mode only) -->
            <div id="chat-list-sidebar" class="chat-list-sidebar">
                <div class="chat-list-header">
                    <h2 id="chat-list-title">Chats</h2>
                    <button id="new-chat-button" class="new-chat-button" title="New chat">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                </div>
                <div id="chat-list" class="chat-list">
                    <!-- Chat items will be dynamically added here -->
                </div>
            </div>

            <!-- Main Chat Area -->
            <div class="main-content">
                <header class="chat-header">
                    <div class="header-content">
                        <div class="header-icon">🌍</div>
                        <div>
                            <h1 id="header-title">Ghana Chatbot</h1>
                            <p class="header-subtitle" id="header-subtitle">Government Helper Assistant</p>
                        </div>
                    </div>
                    <div class="header-actions">
                        <button id="language-toggle" class="language-toggle" title="Switch language">
                            <span id="language-text">EN</span>
                            <span class="language-arrow">⇄</span>
                            <span id="language-text-alt">TWI</span>
                        </button>
                        <button id="reset-button" class="reset-button-icon" title="Reset conversation">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
                                <path d="M21 3v5h-5"></path>
                                <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
                                <path d="M3 21v-5h5"></path>
                            </svg>
                        </button>
                    </div>
                </header>

                <!-- Messages Container -->
                <div id="messages-container" class="messages-container">
                    <div class="chat-message bot welcome">
                        <div class="message-avatar">🤖</div>
                        <div class="message-content">
                            <p id="welcome-message">Hello — I'm a government helper bot. Ask me about the climate, impacts, and solutions.</p>
                        </div>
                    </div>
                </div>

                <!-- Chat Form -->
                <div class="chat-input-container">
                    <form id="chat-form" class="chat-form">
                        <div class="input-wrapper">
                            <input type="text" id="user-input" data-placeholder-en="Type your message..." data-placeholder-twi="Twerɛ wo nsɛm..." autocomplete="off" class="message-input">
                            <div class="input-actions">
                                <label for="file-upload" class="file-upload-label" title="Upload file">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                        <polyline points="17 8 12 3 7 8"></polyline>
                                        <line x1="12" y1="3" x2="12" y2="15"></line>
                                    </svg>
                                    <input type="file" id="file-upload" accept=".pdf,.txt" hidden>
                                </label>
                                <button type="submit" id="send-button" class="send-button-icon" title="Send message">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <line x1="22" y1="2" x2="11" y2="13"></line>
                                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </form>
                    
                    <div class="upload-options">
                        <label for="file-url-input" class="url-input-wrapper">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                            </svg>
                            <input type="url" id="file-url" data-placeholder-en="Or paste a URL..." data-placeholder-twi="Anaasɛ fa URL bi nto hɔ..." class="url-input">
                        </label>
                    </div>

                    <!-- Uploaded Files List -->
                    <div id="uploaded-files" class="uploaded-files">
                        <div class="uploaded-files-header">
                            <span id="uploaded-files-text">📎 Uploaded files</span>
                        </div>
                        <ul id="files-list" class="files-list"></ul>
                    </div>
                </div>
            </div>

            <!-- Sidebar -->
            <div class="sidebar">
                <div class="fact-card">
                    <div class="fact-header">
                        <div class="fact-icon">🌱</div>
                        <h3 id="fact-title">Climate Fact</h3>
                    </div>
                    <div class="fact-content">
                        <p id="current-fact">Loading fact...</p>
                    </div>
                    <button id="new-fact-button" class="fact-button">
                        <span id="new-fact-text">Get New Fact</span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="23 4 23 10 17 10"></polyline>
                            <polyline points="1 20 1 14 7 14"></polyline>
                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
